name: Rust CI
on:
  push:
  pull_request:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s synthetic/tests -v
      - run: python -m unittest discover -s tests -p 'test_release_catalog.py' -v
      - run: python tools/release_catalog.py check
      - name: JSMT/1 real TLS mTLS interoperability tests (Linux only)
        if: runner.os == 'Linux'
        working-directory: protocol/jsmt/v1/reference/python
        run: python -m unittest discover -s tests -v
      - run: python -m synthetic.generate generate --output synthetic/generated/ci_smoke --count 2500 --shard-size 500 --quiet
      - run: python -m synthetic.generate verify --output synthetic/generated/ci_smoke
      - run: python -m synthetic.native_tools generate --output synthetic/generated/native_ci --count 2400 --shard-size 400
      - run: python -m synthetic.native_tools verify --output synthetic/generated/native_ci
      - run: cargo fmt --all -- --check
      - run: cargo run -p jani-check
      - run: cargo test -p jani-claims
      - run: python tools/doccheck.py
      - run: cargo run -p jani-claims -- check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --release -p jani
