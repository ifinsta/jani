# Standalone on purpose: the gateway depends on a sibling checkout of
# ifinsta/siwi (../../siwi), which the main Jani workspace must not require.
[workspace]

[package]
name = "jani-cloud"
description = "Prototype single-container cloud front end for Jani: sign in with ifinsta, one isolated `jani ui` per user."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[dependencies]
siwi = { path = "../../siwi/crates/siwi" }
siwi-axum = { path = "../../siwi/crates/siwi-axum" }
siwi-redis = { path = "../../siwi/crates/siwi-redis", optional = true }
anyhow = "1"
libc = "0.2"
axum = { version = "0.8", features = ["json", "macros"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jani-core = { path = "../backend/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Shared, encrypted session store for more than one gateway instance.
redis = ["dep:siwi-redis"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
