<title>Jani Enterprise</title>
<style>
/* Layout concept: an inset workspace. A slim rail, a calm top bar, and one working surface.
   The chat is a run (state, plan, activity, decision), not a transcript. Flat colour only. */
:root{
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF0F5; --surface-3:#E4E9F0;
  --line:#DCE1E9; --line-strong:#8A93A3;
  --text:#12161C; --text-2:#454E5C; --text-3:#636D7C;
  --accent:#1F5EFF; --accent-tint:#E5EDFF; --on-accent:#FFFFFF;
  --ok:#146C43; --ok-tint:#DFF3E7; --warn:#8A4B00; --warn-tint:#FCEFD2; --bad:#B42318; --bad-tint:#FCE6E3;
  --info:#1F4FBF; --info-tint:#E5EDFF; --neutral-tint:#E9EDF3;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#151A21; --surface-2:#1B222B; --surface-3:#232C37;
  --line:#28313C; --line-strong:#6A7586;
  --text:#E8ECF2; --text-2:#B0B9C6; --text-3:#8F99A8;
  --accent:#7FA6FF; --accent-tint:#17243F; --on-accent:#0A1020;
  --ok:#6FD39A; --ok-tint:#12301F; --warn:#F0B45B; --warn-tint:#34260B; --bad:#FF8F85; --bad-tint:#3A1714;
  --info:#8EB0FF; --info-tint:#17243F; --neutral-tint:#212A35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151A21; --surface-2:#1B222B; --surface-3:#232C37;
  --line:#28313C; --line-strong:#6A7586;
  --text:#E8ECF2; --text-2:#B0B9C6; --text-3:#8F99A8;
  --accent:#7FA6FF; --accent-tint:#17243F; --on-accent:#0A1020;
  --ok:#6FD39A; --ok-tint:#12301F; --warn:#F0B45B; --warn-tint:#34260B; --bad:#FF8F85; --bad-tint:#3A1714;
  --info:#8EB0FF; --info-tint:#17243F; --neutral-tint:#212A35; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);padding-block:0;
  padding-left:var(--gut);padding-right:var(--gut-r);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1{font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:650;letter-spacing:-.005em}
h3{font-size:13px;font-weight:650}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:var(--r-s);z-index:30}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent);text-underline-offset:3px}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:216px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface);margin-block:0}
.rail{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px;fill:currentColor;stroke:none}
.rail-group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);color:var(--text-2);text-decoration:none;border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer;font-weight:520}
.nav:hover{background:var(--surface-3);color:var(--text)}
.nav[aria-current="page"]{background:var(--surface);color:var(--text);border-color:var(--line)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav .n{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:650;padding:0 6px}
.rail-foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top .crumb{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.top .crumb b{font-size:15px;font-weight:650}
.top .crumb span{font-size:12px;color:var(--text-3)}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:3px 8px 3px 4px;background:var(--surface)}
.who select{border:0;background:none;padding:4px 2px;cursor:pointer;font-weight:550;max-width:210px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-tint);color:var(--accent);flex:none}
.avatar.lg{width:40px;height:40px;font-size:14px}
.avatar.jani{background:var(--accent);color:var(--on-accent)}
.avatar.jani svg{width:14px;height:14px;fill:currentColor;stroke:none}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);cursor:pointer;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.view{flex:1;min-height:0;overflow:auto;padding:22px 24px 40px}
.view.fill{overflow:hidden;padding:0}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}

/* buttons, chips, status */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:560;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.94)}
.btn.quiet{border-color:transparent;background:none;color:var(--text-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--neutral-tint);color:var(--text-2);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.live::before{animation:pulse 1.4s ease-in-out infinite}
.st.ok{background:var(--ok-tint);color:var(--ok)} .st.warn{background:var(--warn-tint);color:var(--warn)}
.st.bad{background:var(--bad-tint);color:var(--bad)} .st.info{background:var(--info-tint);color:var(--info)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:99px;padding:5px 12px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-2)}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}

/* surfaces */
.panel{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{margin-right:auto}
.rows>*{padding:12px 16px;border-top:1px solid var(--line)}
.rows>*:first-child{border-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.stats>div{padding:14px 16px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats .v{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stats .l{font-size:12px;color:var(--text-3)}
.stats .d{font-size:12px;margin-top:2px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .lead{max-width:62ch;color:var(--text-2);margin-top:6px}
.page-head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp{margin-left:auto}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:80px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.ok>i{background:var(--ok)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
.tw{overflow-x:auto}

/* home */
.hello{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.hello h1{font-size:28px;letter-spacing:-.02em}
.next{border:1px solid var(--accent);border-radius:var(--r-m);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px}
.next .why{background:var(--accent-tint);border-radius:var(--r-s);padding:10px 12px;font-size:13px;color:var(--text)}
.next .why b{color:var(--accent)}
.tasklist .t{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.tasklist .t:hover{background:var(--surface-2)}
.tasklist .t .tt{font-weight:600}
.tasklist .t .tm{font-size:12px;color:var(--text-3)}
.ask-row{display:flex;gap:8px;flex-wrap:wrap}
.askbox{display:flex;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-m);padding:6px 6px 6px 14px;background:var(--surface);align-items:center}
.askbox input{flex:1;border:0;background:none;min-width:0;padding:8px 0;outline:0}
.askbox:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* work: run view */
.work{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr) 290px;min-height:0}
.work>*{min-height:0;min-width:0}
.queue{border-right:1px solid var(--line);overflow:auto;background:var(--surface)}
.queue h3{padding:14px 16px 6px;color:var(--text-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.qi{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;cursor:pointer}
.qi:hover{background:var(--surface-2)}
.qi[aria-current="true"]{background:var(--accent-tint)}
.qi b{display:block;font-weight:600;margin-bottom:4px}
.run{display:flex;flex-direction:column;min-height:0}
.run-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.goal{font-size:17px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--text-3);align-items:center}
.facts b{color:var(--text-2);font-weight:600}
.run-body{flex:1;min-height:0;overflow:auto;padding:16px 20px 20px;scroll-behavior:smooth}
.plan{display:flex;flex-wrap:wrap;gap:6px 6px;margin-bottom:16px}
.plan li{list-style:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;font-size:13px;background:var(--surface);color:var(--text-3)}
.plan{padding:0;margin:0 0 16px}
.plan li .m{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.plan li.done{color:var(--ok);background:var(--ok-tint);border-color:transparent}
.plan li.done .m{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.plan li.active{color:var(--text);border-color:var(--accent)}
.plan li.active .m{border-style:dashed;animation:spin 3s linear infinite}
.plan li.waiting{color:var(--warn);background:var(--warn-tint);border-color:transparent}
.plan li .m svg{width:10px;height:10px;stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}
.stream{display:flex;flex-direction:column;gap:14px}
.ev{display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ev .b{flex:1;min-width:0}
.bubble{background:var(--surface-2);border-radius:var(--r-m);padding:10px 14px;max-width:70ch}
.bubble.me{background:var(--accent);color:var(--on-accent);margin-left:auto}
.ev.me{flex-direction:row-reverse}
.cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:pulse 1s steps(2) infinite}
.toolrow{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px;font-size:13px;background:var(--surface)}
.toolrow summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.toolrow summary::-webkit-details-marker{display:none}
.toolrow summary .d{margin-left:auto;color:var(--text-3);font-size:12px}
.toolrow pre{margin:8px 0 0;font:12px/1.5 var(--mono);color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.card{border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);overflow:hidden;max-width:640px}
.card.gate{border-color:var(--warn)}
.card.gate>.h{background:var(--warn-tint);color:var(--warn)}
.card.askc{border-color:var(--accent)}
.card.askc>.h{background:var(--accent-tint);color:var(--accent)}
.card.done{border-color:var(--ok)}
.card.done>.h{background:var(--ok-tint);color:var(--ok)}
.card>.h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:650;font-size:13px}
.card .bd{padding:14px;display:flex;flex-direction:column;gap:12px}
.card .what{font-size:15px;font-weight:600;line-height:1.4}
.facts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.facts-grid>div{background:var(--surface);padding:8px 10px}
.facts-grid .k{font-size:11px;color:var(--text-3)}
.facts-grid .v{font-weight:650;font-variant-numeric:tabular-nums}
.preview{border:1px solid var(--line);border-radius:var(--r-s);overflow:auto;max-height:180px}
.preview table{font-size:13px}
.preview td,.preview th{padding:6px 10px}
.preview .add{background:var(--ok-tint)}
.preview .was{color:var(--text-3);text-decoration:line-through}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card .note{font-size:12px;color:var(--text-3)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.card .own{display:flex;gap:8px}
.card .own input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;background:var(--surface)}
.decided{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);padding:8px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-s);max-width:640px}
.composer{border-top:1px solid var(--line);padding:12px 20px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.composer .chips{display:flex;gap:6px;flex-wrap:wrap}
.start{display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:640px}
.ctx{border-left:1px solid var(--line);overflow:auto;background:var(--surface);padding:6px 0 20px}
.ctx section{padding:12px 16px;border-bottom:1px solid var(--line)}
.ctx h3{margin-bottom:8px;color:var(--text-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.perm{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.perm .st{flex:none;margin-top:1px}
.src{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.mem{font-size:13px;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.mem button{margin-left:auto;border:0;background:none;color:var(--text-3);cursor:pointer;padding:0 4px}
.mem button:hover{color:var(--bad)}

/* map */
.map{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:36px;align-items:start;margin-top:8px}
.col h3{color:var(--text-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.col .nodes{display:flex;flex-direction:column;gap:12px}
.node{position:relative;text-align:left;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.node:hover{background:var(--surface-2)}
.node[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.node b{font-weight:650}
.node .sub{font-size:12px;color:var(--text-2)}
.node.you{border-color:var(--accent);background:var(--accent-tint)}
.node .you-tag{position:absolute;top:-9px;left:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:650;padding:1px 8px;border-radius:99px}
svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.edges path{fill:none;stroke:var(--line-strong);stroke-width:1.4}
svg.edges path.on{stroke:var(--accent);stroke-width:2}
svg.edges path.flow{stroke-dasharray:4 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.detail{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:16px;margin-top:20px}

/* proof */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.tl .e{position:relative;padding:0 0 18px}
.tl .e::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl .e.dec::before{border-color:var(--accent);background:var(--accent)}
.tl .e.chg::before{border-color:var(--warn);background:var(--warn)}
.tl .e .t{font-size:12px;color:var(--text-3)}
.tl details summary{cursor:pointer;color:var(--text-3);font-size:12px;margin-top:4px}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps .s{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--text-3)}
.steps .s.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.steps .s.done{color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lb{font-weight:600}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line-strong);border-radius:var(--r-s);padding:9px 11px;background:var(--surface);width:100%}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--text-3)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;background:var(--surface)}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden}
