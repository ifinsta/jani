<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Jani</title>
<style nonce="__NONCE__">
/* Layout concept: an inset workspace. A slim rail, a calm top bar, and one working surface.
   The chat is a run (state, plan, activity, decision), not a transcript. Flat colour only. */
:root{
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF0F5; --surface-3:#E4E9F0;
  --line:#DCE1E9; --line-strong:#8A93A3;
  --text:#12161C; --text-2:#454E5C; --text-3:#636D7C;
  --accent:#1F5EFF; --accent-tint:#E5EDFF; --on-accent:#FFFFFF;
  --ok:#146C43; --ok-tint:#DFF3E7; --warn:#8A4B00; --warn-tint:#FCEFD2; --bad:#B42318; --bad-tint:#FCE6E3;
  --info:#1F4FBF; --info-tint:#E5EDFF; --neutral-tint:#E9EDF3;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#151A21; --surface-2:#1B222B; --surface-3:#232C37;
  --line:#28313C; --line-strong:#6A7586;
  --text:#E8ECF2; --text-2:#B0B9C6; --text-3:#8F99A8;
  --accent:#7FA6FF; --accent-tint:#17243F; --on-accent:#0A1020;
  --ok:#6FD39A; --ok-tint:#12301F; --warn:#F0B45B; --warn-tint:#34260B; --bad:#FF8F85; --bad-tint:#3A1714;
  --info:#8EB0FF; --info-tint:#17243F; --neutral-tint:#212A35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151A21; --surface-2:#1B222B; --surface-3:#232C37;
  --line:#28313C; --line-strong:#6A7586;
  --text:#E8ECF2; --text-2:#B0B9C6; --text-3:#8F99A8;
  --accent:#7FA6FF; --accent-tint:#17243F; --on-accent:#0A1020;
  --ok:#6FD39A; --ok-tint:#12301F; --warn:#F0B45B; --warn-tint:#34260B; --bad:#FF8F85; --bad-tint:#3A1714;
  --info:#8EB0FF; --info-tint:#17243F; --neutral-tint:#212A35; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);padding-block:0;
  padding-left:var(--gut);padding-right:var(--gut-r);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1{font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:650;letter-spacing:-.005em}
h3{font-size:13px;font-weight:650}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:var(--r-s);z-index:30}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent);text-underline-offset:3px}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:216px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface);margin-block:0}
.rail{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px;fill:currentColor;stroke:none}
.rail-group{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);color:var(--text-2);text-decoration:none;border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer;font-weight:520}
.nav:hover{background:var(--surface-3);color:var(--text)}
.nav[aria-current="page"]{background:var(--surface);color:var(--text);border-color:var(--line)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav .n{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:650;padding:0 6px}
.rail-foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top .crumb{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.top .crumb b{font-size:15px;font-weight:650}
.top .crumb span{font-size:12px;color:var(--text-3)}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:3px 8px 3px 4px;background:var(--surface)}
.who select{border:0;background:none;padding:4px 2px;cursor:pointer;font-weight:550;max-width:210px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--accent-tint);color:var(--accent);flex:none}
.avatar.lg{width:40px;height:40px;font-size:14px}
.avatar.jani{background:var(--accent);color:var(--on-accent)}
.avatar.jani svg{width:14px;height:14px;fill:currentColor;stroke:none}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);cursor:pointer;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.view{flex:1;min-height:0;overflow:auto;padding:22px 24px 40px}
.view.fill{overflow:hidden;padding:0}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}

/* buttons, chips, status */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:560;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.94)}
.btn.quiet{border-color:transparent;background:none;color:var(--text-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--neutral-tint);color:var(--text-2);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.live::before{animation:pulse 1.4s ease-in-out infinite}
.st.ok{background:var(--ok-tint);color:var(--ok)} .st.warn{background:var(--warn-tint);color:var(--warn)}
.st.bad{background:var(--bad-tint);color:var(--bad)} .st.info{background:var(--info-tint);color:var(--info)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:99px;padding:5px 12px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text-2)}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}

/* surfaces */
.panel{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{margin-right:auto}
.rows>*{padding:12px 16px;border-top:1px solid var(--line)}
.rows>*:first-child{border-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.stats>div{padding:14px 16px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats .v{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stats .l{font-size:12px;color:var(--text-3)}
.stats .d{font-size:12px;margin-top:2px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head .lead{max-width:62ch;color:var(--text-2);margin-top:6px}
.page-head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sp{margin-left:auto}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:80px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.ok>i{background:var(--ok)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
.tw{overflow-x:auto}

/* home */
.hello{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.hello h1{font-size:28px;letter-spacing:-.02em}
.next{border:1px solid var(--accent);border-radius:var(--r-m);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px}
.next .why{background:var(--accent-tint);border-radius:var(--r-s);padding:10px 12px;font-size:13px;color:var(--text)}
.next .why b{color:var(--accent)}
.tasklist .t{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.tasklist .t:hover{background:var(--surface-2)}
.tasklist .t .tt{font-weight:600}
.tasklist .t .tm{font-size:12px;color:var(--text-3)}
.ask-row{display:flex;gap:8px;flex-wrap:wrap}
.askbox{display:flex;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-m);padding:6px 6px 6px 14px;background:var(--surface);align-items:center}
.askbox input{flex:1;border:0;background:none;min-width:0;padding:8px 0;outline:0}
.askbox:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* work: run view */
.work{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr) 290px;min-height:0}
.work>*{min-height:0;min-width:0}
.queue{border-right:1px solid var(--line);overflow:auto;background:var(--surface)}
.queue h3{padding:14px 16px 6px;color:var(--text-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.qi{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;cursor:pointer}
.qi:hover{background:var(--surface-2)}
.qi[aria-current="true"]{background:var(--accent-tint)}
.qi b{display:block;font-weight:600;margin-bottom:4px}
.run{display:flex;flex-direction:column;min-height:0}
.run-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.goal{font-size:17px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--text-3);align-items:center}
.facts b{color:var(--text-2);font-weight:600}
.run-body{flex:1;min-height:0;overflow:auto;padding:16px 20px 20px;scroll-behavior:smooth}
.plan{display:flex;flex-wrap:wrap;gap:6px 6px;margin-bottom:16px}
.plan li{list-style:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;font-size:13px;background:var(--surface);color:var(--text-3)}
.plan{padding:0;margin:0 0 16px}
.plan li .m{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.plan li.done{color:var(--ok);background:var(--ok-tint);border-color:transparent}
.plan li.done .m{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.plan li.active{color:var(--text);border-color:var(--accent)}
.plan li.active .m{border-style:dashed;animation:spin 3s linear infinite}
.plan li.waiting{color:var(--warn);background:var(--warn-tint);border-color:transparent}
.plan li .m svg{width:10px;height:10px;stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}
.stream{display:flex;flex-direction:column;gap:14px}
.ev{display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ev .b{flex:1;min-width:0}
.bubble{background:var(--surface-2);border-radius:var(--r-m);padding:10px 14px;max-width:70ch}
.bubble.me{background:var(--accent);color:var(--on-accent);margin-left:auto}
.ev.me{flex-direction:row-reverse}
.cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:pulse 1s steps(2) infinite}
.toolrow{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px;font-size:13px;background:var(--surface)}
.toolrow summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.toolrow summary::-webkit-details-marker{display:none}
.toolrow summary .d{margin-left:auto;color:var(--text-3);font-size:12px}
.toolrow pre{margin:8px 0 0;font:12px/1.5 var(--mono);color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.card{border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);overflow:hidden;max-width:640px}
.card.gate{border-color:var(--warn)}
.card.gate>.h{background:var(--warn-tint);color:var(--warn)}
.card.askc{border-color:var(--accent)}
.card.askc>.h{background:var(--accent-tint);color:var(--accent)}
.card.done{border-color:var(--ok)}
.card.done>.h{background:var(--ok-tint);color:var(--ok)}
.card>.h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:650;font-size:13px}
.card .bd{padding:14px;display:flex;flex-direction:column;gap:12px}
.card .what{font-size:15px;font-weight:600;line-height:1.4}
.facts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.facts-grid>div{background:var(--surface);padding:8px 10px}
.facts-grid .k{font-size:11px;color:var(--text-3)}
.facts-grid .v{font-weight:650;font-variant-numeric:tabular-nums}
.preview{border:1px solid var(--line);border-radius:var(--r-s);overflow:auto;max-height:180px}
.preview table{font-size:13px}
.preview td,.preview th{padding:6px 10px}
.preview .add{background:var(--ok-tint)}
.preview .was{color:var(--text-3);text-decoration:line-through}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card .note{font-size:12px;color:var(--text-3)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.card .own{display:flex;gap:8px}
.card .own input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;background:var(--surface)}
.decided{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);padding:8px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-s);max-width:640px}
.composer{border-top:1px solid var(--line);padding:12px 20px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.composer .chips{display:flex;gap:6px;flex-wrap:wrap}
.start{display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:640px}
.ctx{border-left:1px solid var(--line);overflow:auto;background:var(--surface);padding:6px 0 20px}
.ctx section{padding:12px 16px;border-bottom:1px solid var(--line)}
.ctx h3{margin-bottom:8px;color:var(--text-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.perm{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.perm .st{flex:none;margin-top:1px}
.src{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.mem{font-size:13px;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.mem button{margin-left:auto;border:0;background:none;color:var(--text-3);cursor:pointer;padding:0 4px}
.mem button:hover{color:var(--bad)}

/* map */
.map{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:36px;align-items:start;margin-top:8px}
.col h3{color:var(--text-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.col .nodes{display:flex;flex-direction:column;gap:12px}
.node{position:relative;text-align:left;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.node:hover{background:var(--surface-2)}
.node[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.node b{font-weight:650}
.node .sub{font-size:12px;color:var(--text-2)}
.node.you{border-color:var(--accent);background:var(--accent-tint)}
.node .you-tag{position:absolute;top:-9px;left:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:650;padding:1px 8px;border-radius:99px}
svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.edges path{fill:none;stroke:var(--line-strong);stroke-width:1.4}
svg.edges path.on{stroke:var(--accent);stroke-width:2}
svg.edges path.flow{stroke-dasharray:4 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.detail{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:16px;margin-top:20px}

/* proof */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.tl .e{position:relative;padding:0 0 18px}
.tl .e::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl .e.dec::before{border-color:var(--accent);background:var(--accent)}
.tl .e.chg::before{border-color:var(--warn);background:var(--warn)}
.tl .e .t{font-size:12px;color:var(--text-3)}
.tl details summary{cursor:pointer;color:var(--text-3);font-size:12px;margin-top:4px}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps .s{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--text-3)}
.steps .s.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.steps .s.done{color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lb{font-weight:600}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line-strong);border-radius:var(--r-s);padding:9px 11px;background:var(--surface);width:100%}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--text-3)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;background:var(--surface)}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text-2);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.mcard{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.mcard:hover{border-color:var(--line-strong);background:var(--surface-2)}
.mcard .ic{width:36px;height:36px;border-radius:var(--r-s);background:var(--accent-tint);color:var(--accent);display:grid;place-items:center}

/* chart */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px}
.bar .meter{height:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* toast + menu */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-s);font-weight:560;z-index:40;max-width:min(520px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hero-empty{padding:40px 20px;text-align:center;color:var(--text-2)}

/* responsive */
@media (max-width:1180px){.work{grid-template-columns:220px minmax(0,1fr)}.ctx{display:none}.map{gap:22px}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{grid-row:2;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:6px 8px;gap:4px;justify-content:flex-start}
  .brand,.rail-group,.rail-foot{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;width:auto;min-width:68px;align-items:center;text-align:center}
  .nav .n{position:absolute;margin:0;transform:translate(14px,-12px)}
  .nav{position:relative}
  .main{grid-row:1}
  .top{padding:8px 16px}
  .view{padding:16px 16px 28px}
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .queue{display:none}
  .g2,.g3,.g-main{grid-template-columns:minmax(0,1fr)}
  .map{grid-template-columns:minmax(0,1fr);gap:20px}
  svg.edges{display:none}
  .hello h1{font-size:23px}
  .bar{grid-template-columns:84px minmax(0,1fr) 54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
.cite{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin:0 1px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);font-size:10px;font-weight:700;text-decoration:none;vertical-align:1px;background:var(--accent-tint)}
@media (max-width:900px){
  .rail{scrollbar-width:none}
  .nav{flex:none}
  .composer .chips{display:none}
  .run-head{padding:12px 16px}
  .run-head .goal{font-size:15px;line-height:1.35}
  .run-head .facts{display:none}
  .top .crumb span{display:none}
  .ctx{display:none}
}

/* real-app additions */
.top .where{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px;max-width:200px;overflow:hidden;white-space:nowrap}
.top .where svg{width:14px;height:14px}
.top .acct{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.top .acct[hidden],.top [hidden]{display:none}
.evw{display:block}
.fld{border:1px solid var(--line-strong);border-radius:var(--r-s);padding:7px 10px;background:var(--surface);min-width:0}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-2);padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2)}
.note svg{margin-top:2px}
.note.warn{background:var(--warn-tint);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-tint);border-color:transparent;color:var(--bad)}
.card .note{border:0;background:none;padding:0}
.bubble.think{margin-top:6px;color:var(--text-2);font-size:13px;white-space:pre-wrap}
.bubble code,.what code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:1px 5px;border-radius:4px}
pre.cmd{margin:0;padding:10px 12px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
pre.rawpre{margin:8px 0 0;padding:10px 12px;font:12px/1.5 var(--mono);background:var(--surface-2);border-radius:var(--r-s);overflow:auto;max-height:260px}
.tl2{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px}
.tl2>div{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.tl2 .ok svg{color:var(--ok)} .tl2 .no svg{color:var(--bad)}
.ev-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip.static{cursor:default}
.chip.static:hover{background:var(--surface);color:var(--text-2)}
.panel header a{font-size:13px;margin-left:auto}
.toast.warn{background:var(--warn);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden;flex-wrap:wrap}
.panel table.u td:first-child{font-weight:600}
@media (max-width:900px){.top .where{display:none}.top .acct b{display:none}}
.card .own{flex-wrap:wrap}
.card .own input{flex:1 1 180px}

.top{flex-wrap:nowrap}
.top .crumb{min-width:90px;overflow:hidden}
.top .crumb b,.top .crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .acct .btn{padding:4px 8px}
@media (max-width:900px){.top{flex-wrap:wrap}}

  return api('/api/session?after='+T.last).then(function(s){
    var wasBusy=T.busy,added=s.entries&&s.entries.length,prevC=T.consent&&T.consent.id,prevQ=T.question&&T.question.id;
    (s.entries||[]).forEach(function(e){T.entries.push(e);T.last=Math.max(T.last,e.n)});
    T.busy=s.busy;T.step=s.step;T.ended=s.ended;T.turns=s.turns;T.model=s.model;T.taskId=s.taskId;T.fault=s.fault;T.consent=s.consent||null;T.question=s.question||null;
    var ch=added||s.busy!==wasBusy||(T.consent&&T.consent.id)!==prevC||(T.question&&T.question.id)!==prevQ;
    if(ch){renderRail();if(S.page==='work')paintWork();else if(S.page==='home'){$('#needs')&&($('#needs').innerHTML=needsHtml(),bindList($('#needs')))}}
    else if(S.page==='work')paintWorkMeta();
    if((T.consent||T.question)&&!(T._noted)){T._noted=1;if(S.page!=='work')toast('Jani needs you. Open Work to answer.')}
    if(!T.consent&&!T.question)T._noted=0;
    if(wasBusy&&!s.busy)refresh();
  }).catch(function(){}).then(function(){sessionPoll.t=setTimeout(sessionPoll,T.busy?400:(S.page==='work'?1200:3000))});
}

}

function groupRun(){
  var evs=(S.run&&S.run.events)||[],g={},order=[],agent=[];
  evs.forEach(function(e){var id=e.invocation_id;if(!id||id==='run'||e.action==='agent.run'||e.action==='agent.model'||e.action==='mirror.compare'){agent.push(e);return}if(!g[id]){g[id]=[];order.push(id)}g[id].push(e)});
  var reads=[],changes=[],refused=[],held=[];
  order.forEach(function(id){var evs2=g[id],cat=actionOf(evs2[0].action)[1],last=evs2[evs2.length-1],dec=evs2.map(function(e){return e.decision});
    if(dec.indexOf('deny')>-1||dec.indexOf('failed')>-1)refused.push(evs2);
    else if(last.decision==='approval_required')held.push(evs2);
    else if(cat==='read')reads.push(evs2);else changes.push(evs2);});
  return {agent:agent,reads:reads,changes:changes,refused:refused,held:held,total:order.length};
}

}

/* ---------- rules ---------- */
var CHECK=[['repo.read','Read a file'],['repo.list','Look through a folder'],['repo.write','Change a file'],['command.exec','Run a command'],['native.read','Use a built-in tool'],['native.control','Use a built-in tool that changes state'],['skill.read','Read a skill'],['plugin.write','Change something through a plugin']];
function renderRules(){
  asyncPage('rules',function(){
    return api('/api/policy').then(function(d){
      var a=(S.ov&&S.ov.authority)||{},pend=pending(),all=S.approvals.slice().reverse();
      var h=head('Rules','What Jani may do, what needs a person, and the limits. These come from the running process: to change them, restart with different settings or a different signed policy.')+techToggle().replace('class="sp row"','class="row" style="margin-bottom:12px"');
      h+='<div class="grid g2"><section class="panel"><header><h2>What Jani may do</h2></header><div class="rows">'+
        '<div class="row"><span class="st ok">Allowed</span><span>Read files in this project</span></div>'+
        '<div class="row"><span class="st '+(a.allowWrite?'warn':'bad')+'">'+(a.allowWrite?'Asks each time':'Never')+'</span><span>Change files'+(a.allowWrite?' in '+esc(a.writePaths.join(', ')):'')+'</span></div>'+
        '<div class="row"><span class="st '+(a.execMode==='smart'?'ok':a.allowExec?'warn':'bad')+'">'+(a.execMode==='smart'?'Asks when unsure':a.allowExec?'Allowed list only':'Never')+'</span><span>Run commands'+(a.execMode==='smart'?'. Safe ones go ahead. Anything else asks you.':(a.allowExec&&a.execPrograms.length?': '+esc(a.execPrograms.join(', ')):''))+'</span></div>'+
        '<div class="row"><span class="st '+(netOpen(a)?'warn':'ok')+'">'+(netOpen(a)?'Open':'Blocked')+'</span><span>Reach the internet'+(netOpen(a)?'':'. Only the model provider is reachable.')+'</span></div>'+
        '<div class="row"><span class="st '+(a.sandbox==='off'?'warn':'ok')+'">'+(a.sandbox==='off'?'Off':'On')+'</span><span>A sandbox confines commands'+(a.sandbox==='off'?'. Commands are not contained.':'')+'</span></div></div></section>';
      var b=d.budgets||{},lim=function(v,u){return v==null?'No limit':v+(u||'')};
      h+='<section class="panel"><header><h2>Limits</h2></header>'+kvRows([['Steps per task',lim(b.maxToolCalls)],['Spend per task',lim(b.maxUsd,' USD')],['Time per task',lim(b.maxWallSeconds,' seconds')]])+'<div class="rows"><div class="faint">The work stops when a limit is reached. Raising a limit needs a new grant from the operator.</div></div></section></div>';
      var ledgers=S.budgets.slice(0,4);
      if(ledgers.length)h+='<section class="panel" style="margin-top:16px"><header><h2>Used so far</h2></header><div class="rows">'+ledgers.map(function(x){var l=x.ledger,p=l.maxToolCalls?Math.min(100,Math.round(l.toolCalls/l.maxToolCalls*100)):0;return '<div><div class="row"><b>'+esc(taskName(l.taskId))+'</b><span class="sp faint num">'+l.toolCalls+(l.maxToolCalls?' of '+l.maxToolCalls:'')+' steps · $'+(l.usdSpent||0).toFixed(2)+'</span></div>'+(l.maxToolCalls?'<div class="meter'+(p>80?' warn':'')+'" role="progressbar" aria-label="Steps used" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')+'</div></section>';
      h+='<section class="panel" style="margin-top:16px" id="approvals"><header><h2>Approvals</h2><span class="faint">'+pend.length+' waiting</span></header><div class="rows">'+(all.length?all.map(function(x){
        var w={pending:['Waiting','warn'],approved:['Approved, not used yet','info'],rejected:['Rejected','bad'],expired:['Expired',''],consumed:['Used','ok']}[x.status]||[x.status,''];
        var act='';
        if(x.status==='pending'){act=hosted()?'<span class="faint">Waiting for an approver</span>':canDecide()?'<button class="btn sm primary" data-yes="'+esc(x.approvalId)+'">Approve once</button><button class="btn sm danger" data-no="'+esc(x.approvalId)+'">Reject</button>':'<span class="faint">Needs a verified identity</span>'}
        else if(x.status==='approved'||x.status==='rejected')act='<button class="btn sm primary" data-attach="'+esc(x.approvalId)+'">Attach to session</button>';
        return '<div><div class="row"><div style="flex:1;min-width:200px"><b>'+esc(wouldDo(x.capability))+'</b><div class="faint">'+esc(clip(x.resource,80))+' · asked by '+esc(x.requester)+' · needs '+esc(x.requiredRole||'an approver')+(S.tech?' · '+esc(x.approvalId):'')+'</div></div>'+st(w[0],w[1])+act+'</div></div>'}).join(''):'<div class="faint">Nothing has needed approval yet. When a step does, it shows here and on Today, with what it would do.</div>')+(canDecide()||hosted()?'':'<div class="note warn">'+ico('lock')+' Deciding needs a signed identity. Start Jani with an identity file and key, then reload.</div>')+'</div></section>';
      h+='<section class="panel" style="margin-top:16px"><header><h2>Would this be allowed?</h2></header><div class="rows"><div class="faint">Checks one action against the rules loaded now. It does not run anything or add to the record.</div><div class="row"><select class="fld" id="pcA" aria-label="Action">'+CHECK.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>'}).join('')+'</select><input class="fld" id="pcR" value="repo:README.md" aria-label="What it would touch" style="min-width:220px"><button class="btn primary" id="pcGo">Check</button></div><div id="pcOut"></div></div></section>';
      var dp=d.data||{};
      h+='<section class="panel" style="margin-top:16px"><header><h2>What may leave this machine</h2></header>'+kvRows([['Sent to the model',H(chipsRow(dp.allowedModelClasses,'Nothing')),1],['Providers',H(chipsRow(dp.allowedProviders,'None')),1],['Restricted data',dp.allowRestrictedEgress?'Allowed':'Blocked'],['Outputs checked for secrets',dp.inspectOutputs?'Yes':'No']].map(function(r){return [r[0],r[1]&&r[1].html!=null?r[1].html:r[1],r[2]]}))+'</section>';
      if(S.tech)h+='<section class="panel" style="margin-top:16px"><header><h2>Technical</h2></header>'+kvRows([['Policy summary',d.summary],['Revision',d.revision],['Mode',d.mode],['Tenant',d.tenant],['Default sandbox',d.defaultSandboxProfile],['Signed rules',(d.rules||[]).length?JSON.stringify(d.rules):'None. The baseline applies.'],['Denied actions',(d.deniedActions||[]).join(', ')||'None'],['Permission rules',a.permissions||'None']])+'</section>';
      return {html:h,after:function(){
        bindTech(renderRules);
        $$('[data-yes]',view).forEach(function(x){x.onclick=function(){decide(x.getAttribute('data-yes'),true)}});
        $$('[data-no]',view).forEach(function(x){x.onclick=function(){decide(x.getAttribute('data-no'),false)}});
        $$('[data-attach]',view).forEach(function(x){x.onclick=function(){S.pendingSend='/approval '+x.getAttribute('data-attach');location.hash='#work'}});
        $('#pcGo').onclick=function(){var out=$('#pcOut');out.innerHTML='';api('/api/policy/check',{action:$('#pcA').value,resource:$('#pcR').value}).then(function(r){var dec=String(r.decision||'').toLowerCase(),c=dec==='permit'?'ok':dec==='deny'?'bad':'warn';out.innerHTML='<div class="decided" style="margin-top:8px">'+st(dec==='permit'?'Allowed':dec==='deny'?'Refused':'Needs a person',c)+'<span>'+(S.tech?esc(r.reason_code||r.reasonCode||''):'')+'</span></div>'}).catch(function(e){out.innerHTML=failHtml(e)})};
      }};
    });
  });
}

/* ---------- insights ---------- */
function sevSt(s){return st(s,{high:'bad',critical:'bad',medium:'warn',low:'info'}[s]||'')}
function findingHtml(f){return '<div><div class="row">'+sevSt(f.severity)+'<b>'+esc(f.code)+'</b>'+(f.runId?'<span class="sp faint mono">'+esc(short(f.runId,12))+'</span>':'')+'</div><p style="margin-top:4px">'+esc(f.observation)+'</p><p class="muted">'+esc(f.recommendation)+'</p></div>'}
function runSelectHtml(id,val){return '<select class="fld" id="'+id+'" aria-label="Choose a piece of work"><option value="">Choose a piece of work…</option>'+S.runs.map(function(r){return '<option value="'+esc(r.runId)+'"'+(r.runId===val?' selected':'')+'>'+esc(fmtDay(r.firstAt))+' · '+esc(statusWord(r.status)[0])+' · '+short(r.runId,10)+'</option>'}).join('')+'</select>'}
S.mir={run:null,other:null};
function renderInsights(){
  var tabs=[['mirror','What the record suggests'],['agents','Agents and alerts'],['lab','Ideas to test']];
  asyncPage('insights',function(){
    var t=S.insTab,h=head('Insights','Observations from the record. They are rule-based hints, not proven causes, and nothing is applied automatically.')+'<div class="seg" role="tablist" style="margin-bottom:16px">'+tabs.map(function(x){return '<button role="tab" aria-pressed="'+(t===x[0])+'" data-it="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
    var q;
    if(t==='mirror')q=api('/api/mirror?sub=recommendations').then(function(d){var list=d.recommendations||[];return h+(d.note?noteHtml(d.note,'warn'):'')+'<section class="panel" style="margin-top:12px"><header><h2>Suggestions</h2><span class="faint">'+list.length+'</span></header><div class="rows">'+(list.length?list.map(findingHtml).join(''):'<div class="faint">Nothing to flag. The rules found no pattern worth raising in the recorded work.</div>')+'</div></section><section class="panel" style="margin-top:16px"><header><h2>Look at one piece of work</h2></header><div class="rows"><div class="row">'+runSelectHtml('mrRun',S.mir.run)+'</div><div id="mrOut"></div></div></section>'});
    else if(t==='agents')q=api('/api/attention').then(function(d){var pend=d.alerts.filter(function(a){return a.phase==='pending'}).length;return h+statsStrip([['Agents',String(d.agents.length)],['Alerts',String(d.alerts.length)],['Waiting',String(pend),pend?'Need a look':'All clear',pend?'warn':'ok']])+'<section class="panel" style="margin-top:16px"><header><h2>Agents</h2></header>'+(d.agents.length?tbl(['Agent','State','Updated'],d.agents.map(function(a){return [a.agentId,H(st(a.phase,{ready:'ok',running:'info live',paused:'warn',quarantined:'bad'}[a.phase]||'')),fmtDay(a.updatedAt)]})):'<div class="rows"><div class="faint">No other agents are registered. An agent gets its own inbox and can be paused or woken.</div></div>')+'</section>'+(d.alerts.length?'<section class="panel" style="margin-top:16px"><header><h2>Alerts</h2></header>'+tbl(['What','From','How serious','State'],d.alerts.slice(0,20).map(function(a){return [a.event+' · '+a.reference,a.source,H(sevSt(a.severity)),H(st(a.phase,a.phase==='pending'?'warn':''))]}))+'</section>':'')+noteHtml('An alert is information, not an instruction or permission. Registering agents and sending alerts stay on the command line so each is tied to a verified person.')});
    else q=api('/api/lab'+(S.lab&&S.lab.run?'?run='+encodeURIComponent(S.lab.run):'')).then(function(d){var ps=(d.proposal&&d.proposal.proposals)||[];return h+noteHtml('Ideas here are questions to test, not fixes to apply. This page cannot run trials, sign evidence or deploy.','warn')+'<section class="panel" style="margin-top:12px"><header><h2>Ideas from one piece of work</h2></header><div class="rows"><div class="row">'+runSelectHtml('labRun',S.lab&&S.lab.run)+'</div>'+(d.proposal?(ps.length?ps.map(function(p){return '<div><div class="row"><b>'+esc(p.code)+'</b>'+st('Idea only','warn')+'</div><p style="margin-top:4px">'+esc(p.observation)+'</p><p class="muted">'+esc(p.hypothesis)+'</p></div>'}).join(''):'<div class="faint">No findings for this work, so nothing to test.</div>'):'<div class="faint">Choose a piece of work to see ideas to test.</div>')+'</div></section>'});
    return q.then(function(html){return {html:html,after:function(){
      $$('[data-it]',view).forEach(function(b){b.onclick=function(){S.insTab=b.getAttribute('data-it');renderInsights()}});
      var mr=$('#mrRun');if(mr)mr.onchange=function(){S.mir.run=mr.value||null;var out=$('#mrOut');out.innerHTML='';if(!S.mir.run)return;api('/api/mirror?sub=critique&run='+encodeURIComponent(S.mir.run)).then(function(d){out.innerHTML='<div class="row" style="padding:12px 16px">'+stFor(d.outcome==='completed'?'completed':'unreconciled')+'<span class="muted">'+plural(d.eventCount,'step')+' · '+esc(d.elapsedObservedSeconds)+' s</span></div>'+(d.findings.length?d.findings.map(findingHtml).join(''):'<div class="faint" style="padding:0 16px 12px">No rule fired for this work.</div>')}).catch(function(e){out.innerHTML=failHtml(e)})};
      var lr=$('#labRun');if(lr)lr.onchange=function(){S.lab={run:lr.value||null};renderInsights()};
    }}});
  });
}

/* ---------- setup ---------- */
function renderSetup(){
  var tabs=[['system','Safety'],['native','Built-in tools'],['updates','Updates']];
  asyncPage('setup',function(){
    var t=S.setTab,h=head('Setup','What confines Jani, which tools it has, and which version you are running.')+'<div class="seg" role="tablist" style="margin-bottom:16px">'+tabs.map(function(x){return '<button role="tab" aria-pressed="'+(t===x[0])+'" data-st="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>',q;
    if(t==='system')q=api('/api/system').then(function(d){var sb=d.sandbox,bk=(sb.doctor&&sb.doctor.backends)||[],pl=d.plugins,list=(pl&&pl.list&&pl.list.plugins)||[];
      return h+'<section class="panel"><header><h2>Confinement</h2></header>'+kvRows([['Mode',sb.configured],['Network',sb.network==='isolated'?'Blocked, except the model provider':sb.network],['Host',((sb.doctor.os||'')+' '+(sb.doctor.arch||'')).trim()]])+tbl(['Backend','Available','Keeps files contained','Keeps network contained'],bk.map(function(b){return [b.name,H(st(b.available?'Yes':'No',b.available?'ok':'')),H(st(b.confinesFilesystem?'Yes':'No',b.confinesFilesystem?'ok':'warn')),H(st(b.confinesNetwork?'Yes':'No',b.confinesNetwork?'ok':'warn'))]}))+'</section>'+
      '<section class="panel" style="margin-top:16px"><header><h2>Plugins</h2></header><div class="rows">'+(pl.error?'<div class="note bad">'+esc(pl.error)+'</div>':list.length?list.map(function(p){return '<div>'+esc(p.id||p.name||'plugin')+'</div>'}).join(''):'<div class="faint">No plugins are set up.</div>')+'</div></section>'+
      '<section class="panel" style="margin-top:16px"><header><h2>Trusted keys</h2></header>'+kvRows([['Policy keys',d.keys.policyKeys],['Plugin keys',d.keys.pluginKeys],['Lab keys',d.keys.labKeys]])+'<div class="rows"><div class="faint">Counts only. Key material is never shown.</div></div></section>'});
    else if(t==='native')q=api('/api/native').then(function(cat){return h+'<div class="grid g2">'+cat.map(function(tl){return '<section class="panel"><header><h2>'+esc(tl.tool)+'</h2></header><div class="rows"><div class="muted">'+esc(tl.summary)+'</div>'+tl.operations.map(function(o,i){return '<div><div class="row"><code>'+esc(o.name+(o.args?' '+o.args:''))+'</code>'+(o.runnable?(o.args?'<input class="fld" data-na="'+esc(tl.tool+'.'+o.name)+'" placeholder="'+esc(o.args)+'" aria-label="'+esc(tl.tool+' '+o.name)+' arguments">':'')+'<button class="btn sm" data-nr="'+esc(tl.tool+'|'+o.name)+'">Run</button>':st(o.privileged?'Operator only':'Changes state','warn'))+'</div><div data-no="'+esc(tl.tool+'|'+o.name)+'"></div></div>'}).join('')+'</div></section>'}).join('')+'</div>'+noteHtml('Every run, including a read-only one, goes through the rules and is written to the record.','warn')});
    else q=api('/api/updates').then(function(u){return h+'<section class="panel"><header><h2>This installation</h2></header>'+kvRows([['Version',u.version],['Release source',u.source||'Not set up'],['Targets',(u.targets&&u.targets.length)?u.targets.join(', '):'This program only']])+'<div class="rows"><div class="faint">'+esc(u.note||'')+'</div><div class="row"><button class="btn primary" id="updGo" '+(u.source?'':'disabled')+'>Check for updates</button></div><div id="updOut"></div><div class="faint">Checking contacts the release source. It is the only place Jani reaches out, and only when you press the button.</div></div></section>'});
    return q.then(function(html){return {html:html,after:function(){
      $$('[data-st]',view).forEach(function(b){b.onclick=function(){S.setTab=b.getAttribute('data-st');renderSetup()}});
      $$('[data-nr]',view).forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-nr').split('|'),inp=$('[data-na="'+p[0]+'.'+p[1]+'"]',view),out=$('[data-no="'+p[0]+'|'+p[1]+'"]',view);out.innerHTML='';api('/api/native/run',{tool:p[0],op:p[1],args:inp&&inp.value.trim()?inp.value.trim().split(/\s+/):[]}).then(function(r){out.innerHTML='<pre class="rawpre">'+esc(JSON.stringify(r,null,2))+'</pre>'}).catch(function(e){out.innerHTML=failHtml(e)})}});
      var ug=$('#updGo');if(ug)ug.onclick=function(){ug.disabled=true;$('#updOut').innerHTML='<div class="faint">Checking…</div>';api('/api/updates/check',{}).then(function(r){$('#updOut').innerHTML=noteHtml(r.updateAvailable?'Update available: '+r.latestVersion+'.':'Up to date at '+r.latestVersion+'.',r.updateAvailable?'warn':'')}).catch(function(e){$('#updOut').innerHTML=failHtml(e)}).then(function(){ug.disabled=false})};
    }}});
  });
}

/* ---------- about ---------- */
function renderAbout(){
  view.innerHTML=head('About this workspace','Built for people who are not engineers. It shows how one agent can serve many jobs without anyone needing to learn how it works.')+
  '<div class="grid g2"><section class="panel"><header><h2>How it behaves</h2></header><div class="rows"><div><b>A run, not a chat.</b> Every piece of work shows its state, what happened, and a clear stop before anything changes.</div><div><b>Reads are free, actions wait.</b> Anything that writes, runs or sends stops at a card that shows exactly what would happen.</div><div><b>Jani proposes, people decide.</b> Approvals are recorded with who decided and when.</div><div><b>Everything leaves proof</b> in plain language, with technical detail one click away.</div></div></section><section class="panel"><header><h2>What is real here</h2></header><div class="rows"><div>Everything on these pages is read from this running process: its work, approvals, limits and record. Nothing is sample data.</div><div>An empty page means nothing has happened yet, not that something is hidden.</div><div>The record proves what was done, not that it was right. Check the results before you rely on them.</div></div></section></div>';
}

/* ---------- router ---------- */
function renderPage(soft){
  var p=S.page;
  if(p!=='work')view.classList.remove('fill');
  if(p==='home'){view.innerHTML=homeHtml();bindHome()}
  else if(p==='work'){if(soft&&$('#rs')){paintWork();return}renderWork()}
  else if(p==='tasks')renderTasks();else if(p==='map')renderMap();else if(p==='proof')renderProof();else if(p==='rules')renderRules();
  else if(p==='insights')renderInsights();else if(p==='setup')renderSetup();else renderAbout();
}
function route(){
  var h=(location.hash||'#home').slice(1);if(!PAGES[h])h='home';
  S.page=h;renderRail();renderTop();
  if(h==='home'||h==='tasks'||h==='map'||h==='rules'||h==='proof'){loadAll().then(function(){if(S.page===h){renderRail();renderPage()}})}
  else renderPage();
  if(h!=='work')view.scrollTop=0;
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',function(){if(S.page==='map')renderMap()});
(function(){var th=store('jani.theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);S.tech=store('jani.tech')==='1'})();
loadOverview().then(function(){return loadAll()}).then(function(){route();sessionPoll()});
setInterval(function(){if(document.hidden||T.busy)return;loadAll().then(function(){renderRail();if(S.page==='home')renderPage(true)})},8000);

})();
</script>
