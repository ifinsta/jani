[package]
name = "jani"
description = "Rust-native, skill-aware coding agent with a governed execution runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jani-core.workspace = true
jani-store.workspace = true
jani-mirror.workspace = true
jani-mcp.workspace = true
jani-native.workspace = true
ed25519-dalek = "2"
hex.workspace = true
regex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
