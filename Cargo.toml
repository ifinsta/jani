[workspace]
resolver = "2"
members = [
    "backend/core",
    "backend/store",
    "backend/server",
    "backend/mirror",
    "backend/mcp",
    "backend/native",
    "tools/jani-check",
    "tools/jani-claims",
]
default-members = ["backend/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ifinsta/jani"

[workspace.dependencies]
jani-core = { path = "backend/core" }
jani-store = { path = "backend/store" }
jani-mirror = { path = "backend/mirror" }
jani-mcp = { path = "backend/mcp" }
jani-native = { path = "backend/native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
