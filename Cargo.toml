[package]
name = "jani"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust-native, skill-aware AI coding agent with default-deny tool permissions"
repository = "https://github.com/ifinsta/jani"

[dependencies]
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
